<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9a2e2a">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Kare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241e1b;--paper:#f6efe2;--card:#fffcf6;--ac:#9a2e2a;--ac2:#2e5e52;--mut:#8c8072;--line:#e4d9c7;--ok:#2e5e52;--bad:#b5502b;--r:14px;--r-sm:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font:16px/1.55 'Work Sans',system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:560;letter-spacing:-.015em;margin:0 0 .4em;line-height:1.1}
h1{font-size:2.15rem}h2{font-size:1.3rem}
a{color:var(--ac)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.btn:focus-within{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
label.f{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{min-height:0;padding:6px 12px;font-size:.85rem}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.wrap p{max-width:62ch}
.wrap.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.mut{color:var(--mut)}.err{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--mut);margin:0 0 14px}
.chk input{width:auto;margin-top:3px}
.hero{padding:40px 0 22px;position:relative}
.hero p{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:1.08rem;color:var(--mut);margin-top:-.1em}
.hero::after{content:'';position:absolute;left:0;bottom:4px;width:52px;height:3px;background:var(--ac);border-radius:2px}
.hero.has-bg{--ww:720px;margin:14px calc(50% - 50vw) 26px;width:100vw;box-sizing:border-box;min-height:min(72vh,620px);padding:20vh max(20px,calc((100vw - var(--ww)) / 2 + 16px)) 36px;border-radius:0;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.hero.has-bg h1,.hero.has-bg p{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero.has-bg::after{background:#fff;left:max(20px,calc((100vw - var(--ww)) / 2 + 16px))}
.wrap.wide .hero.has-bg{--ww:1100px}
.hero.modern{text-align:left}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;border-radius:inherit;background-color:var(--line)}
.hero .bgimg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(36,30,27,.05) 0%,rgba(36,30,27,.2) 45%,rgba(36,30,27,.82) 100%)}
@media (max-width:560px){.hero.has-bg{min-height:58vh;padding:16vh 18px 30px}.hero.has-bg::after{left:18px}}
.hero small{color:var(--ac);font-weight:600}
.lang{display:inline-flex;gap:2px}
.lang button{border:0;background:none;color:var(--mut);padding:2px 7px;cursor:pointer;font-size:.85rem}
.lang button.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pk-opt{display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}
.pk-opt input{width:auto;accent-color:var(--ac);flex:none}
.pk-opt:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--card))}
.pk-opt .tag{position:absolute;top:-9px;right:14px;background:var(--ac);color:#fff;font-size:.68rem;font-weight:600;padding:2px 9px;border-radius:999px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.step{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--card)}
.step em{color:var(--ac);display:flex}
.step b{font-family:'Fraunces',Georgia,serif;font-weight:560;font-size:1.02rem}
.step span{font-size:.82rem;color:var(--mut)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0 0 20px}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat em{color:var(--ac);flex:none;margin-top:2px}
.feat b{display:block;font-size:.95rem}
.feat span{font-size:.82rem;color:var(--mut)}
.pk-opt b.price{font-family:'Fraunces',Georgia,serif;font-size:1.2rem;font-weight:600;white-space:nowrap}
#qlist{list-style:none;padding:0;margin:14px 0 0}
#qlist li{display:grid;grid-template-columns:36px 1fr 76px 64px 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
#qlist span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qlist .th{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
#qlist em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right;font-size:.78rem}
#qlist .qx{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.85rem;line-height:1;padding:0;color:var(--mut)}
#qlist .qx:hover{border-color:var(--ac);color:var(--ac)}
#qlist li[data-state=fail] em,#qlist li[data-state=fatal] em{color:var(--bad)}
#qlist li[data-state=done] em{color:var(--ok)}
#qlist li[data-state=cancelled]{opacity:.45;transition:opacity .3s}
.qhead{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:.85rem}
progress{width:100%;height:6px;accent-color:var(--ac);border:0;border-radius:99px;overflow:hidden;background:var(--line)}
progress::-webkit-progress-bar{background:var(--line);border-radius:99px}
progress::-webkit-progress-value{background:var(--ac);border-radius:99px}
progress::-moz-progress-bar{background:var(--ac);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:6px;overflow:hidden;background:#ece2d0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .by{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:.72rem;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph .play,.ph .fav,.ph .st{position:absolute;font-style:normal;color:#fff;font-size:.8rem}
.ph .play{inset:auto auto 22px 8px}.ph .fav{top:6px;right:8px;font-size:1.1rem;color:#ffd24a}
.ph .st{top:6px;left:6px;background:rgba(0,0,0,.6);padding:1px 7px;border-radius:99px}
.ph.pending img{filter:saturate(.55)}
.ph.pending:after{content:'';position:absolute;top:7px;left:7px;width:9px;height:9px;border-radius:50%;background:#e8a317;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ph.hidden img{opacity:.35}
.ph .ic{display:grid;place-items:center;height:100%;color:var(--mut)}
.ph .ck{display:none;position:absolute;inset:0;background:color-mix(in srgb,var(--ac) 35%,transparent);border:3px solid var(--ac)}
.ph .ck:after{content:'✓';position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph.sel .ck{display:block}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 20px;text-align:center;color:var(--mut)}
.empty em{font-style:normal;opacity:.55}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.modal>div{animation:none!important}.spin{animation-duration:1.6s}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.topbar{position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5}
.modal{position:fixed;inset:0;background:rgba(20,16,30,.72);display:grid;place-items:center;padding:14px;z-index:50;overflow:auto;animation:mfade .15s ease}
.modal>div{background:var(--card);border-radius:var(--r);padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;animation:mpop .18s cubic-bezier(.2,.9,.3,1)}
.modal.wide>div{max-width:820px}
.wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wish{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;text-align:center}
.wish em{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,#fff);color:var(--ac);font-style:normal;font-weight:600;font-size:.8rem;margin-bottom:8px}
.wish p{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:.95rem;margin:0 0 8px;color:var(--ink)}
.wish b{font-size:.78rem;font-weight:500;color:var(--mut)}
.demo-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px}
.demo-stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 8px;text-align:center}
.demo-stats b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.6rem;font-weight:560;color:var(--ac);line-height:1.1}
.demo-stats span{font-size:.75rem;color:var(--mut)}
@media (max-width:560px){.demo-stats{grid-template-columns:repeat(2,1fr)}}
.ph.broken::before{content:'⚠';position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:1.2rem}
.ph .vbadge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;display:grid;place-items:center}
.demo-cta{text-align:center;padding:28px 18px;margin-top:28px}
.demo-cta p{margin:0 auto 14px}
.swatches{align-items:center;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--ac)}
#s3[type=color]{width:30px;height:30px;padding:1px;border-radius:50%;cursor:pointer;border:1px solid var(--line)}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tpl-opt{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tpl-opt:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--card))}
.tpl-opt input{display:none}
.tpl-opt b{font-size:.82rem}
.tpl-opt span{color:var(--mut);font-size:.7rem}
.qr-prev{display:flex;justify-content:center;margin:16px 0}
.qr-prev-card{--qc:#9a2e2a;border:1.5px solid var(--qc);border-radius:10px;padding:18px;text-align:center;width:180px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff}
.qr-prev-card b{font-family:'Fraunces',Georgia,serif;font-size:1rem;color:#241e1b}
.qr-prev-card small{color:#8c8072;font-size:.7rem}
.qr-prev-card img{width:100px;height:100px;margin:5px 0}
.qr-prev-card em{font-style:normal;font-size:.62rem;color:#8c8072}
.qr-prev-card.tpl-minimal b,.qr-prev-card.tpl-minimal small{display:none}
.qr-prev-card.tpl-elegant{box-shadow:0 0 0 1px var(--qc),0 0 0 6px #fff,0 0 0 7px var(--qc)}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.modal.lb>div{max-width:960px;background:#111;color:#fff;padding:12px}
.lb .media{display:grid;place-items:center;min-height:200px}
.lb img,.lb video{max-width:100%;max-height:68vh;border-radius:8px}
.lb .btn{background:#222;color:#fff;border-color:#444}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
.badge{font-size:.75rem;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,#fff);color:var(--ac);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:99;font-size:.9rem}
.links a{word-break:break-all;font-size:.8rem}
.qrbox{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.qrbox figure{margin:0;text-align:center;font-size:.75rem;color:var(--mut)}
.qrbox img{width:110px;height:110px;image-rendering:pixelated;background:#fff;padding:10px;box-shadow:0 0 0 1px var(--line),0 0 0 5px var(--card),0 0 0 6px var(--line);border-radius:4px;margin-bottom:8px}
.stat-row{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:.8rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.off{background:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 12px}
.bar>i{display:block;height:100%;background:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border:1px solid var(--line);border-radius:var(--r-sm);text-decoration:none;color:var(--ink);text-align:center;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 5%,var(--card));color:var(--ac)}
.tile em{font-style:normal;display:flex}
.tile span{font-size:.88rem;font-weight:600}
.tile b{font-size:.72rem;font-weight:400;color:var(--mut)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--mut);font-size:.82rem;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:'⋯ ';font-weight:700}
details.more[open] summary{margin-bottom:8px}
/* canlı duvar */
.wall{position:fixed;inset:0;background:#0d0b14;color:#fff;overflow:hidden}
.wall #stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:grid;place-items:center;animation:fin 1s ease;overflow:hidden}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain}
.slide img{animation:kb 7s ease-out forwards}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 40px 28px;background:linear-gradient(transparent,color-mix(in srgb,var(--ink,#1d1b2c) 85%,var(--ac,#9a2e2a) 15%));font-size:1.6rem;font-family:'Fraunces',serif}
.slide .cap small{display:block;font-size:1rem;opacity:.8;font-family:inherit}
.wtitle{position:absolute;top:18px;left:24px;z-index:3;text-shadow:0 1px 6px #000}
.wtitle b{display:block;font-family:'Fraunces',serif;font-size:1.3rem;font-weight:560}
.wtitle small{font-family:'Fraunces',serif;font-style:italic;opacity:.85;font-size:.9rem}
@keyframes kb{from{transform:scale(1.001)}to{transform:scale(1.045)}}
.wqr{position:absolute;right:18px;bottom:18px;z-index:3;background:#fff;color:#111;padding:8px;border-radius:12px;text-align:center;font-size:.7rem;width:130px}
.wqr img{width:100%;image-rendering:pixelated}
.fsb{position:absolute;top:14px;right:14px;z-index:3;opacity:.5}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slide,.slide img{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ====== AYARLAR ====== */
const BRAND = 'Kare';                 // varsayılan marka adı
const WA_NUMBER = '905XXXXXXXXX';     // baskı siparişi WhatsApp numaranız
const CFG = {                          // Firebase konsolundan kopyalayın
  apiKey: 'AIzaSyC4EvV2jR7JAKlPR3DKBwD0Q9vvNNzYyUA',
  authDomain: 'kare-album.firebaseapp.com',
  projectId: 'kare-album',
  storageBucket: 'kare-album.firebasestorage.app',
  messagingSenderId: '476715654923',
  appId: '1:476715654923:web:d396c64248bc1f76f54c0e'
};
const FN_URL = '/api';                 // ödeme fonksiyonlarının adresi (firebase.json rewrite). Hosting başka yerdeyse tam URL yazın
const SLUG_DOMAIN = '';                // örn. 'kare.com' → https://ayse-mehmet.kare.com (tools/worker.js gerekir). Boşsa #/s/kisa-ad kullanılır
const PK = {                           // Panelde "Paketler ve Fiyatlandırma" bölümünden değiştirilebilir. Buradakiler yalnızca ilk kurulum / yedek değer.
  basic:   {n:'Temel',   quotaGB:4,  wall:false, ai:false, months:6,  price:1490},
  plus:    {n:'Plus',    quotaGB:12, wall:true,  ai:false, months:12, price:2990},
  premium: {n:'Premium', quotaGB:30, wall:true,  ai:true,  months:24, price:4990}
};
const GB = 1073741824;
let pkLoaded = false;
async function loadPK() {   // config/packages dokümanı varsa üstüne yazar; PK nesnesinin referansı aynı kalır, her yerde otomatik günceller
  if (pkLoaded) return; pkLoaded = true;
  try {
    const s = await db.doc('config/packages').get();
    if (s.exists) { const d = s.data(); for (const k of Object.keys(PK)) if (d[k]) Object.assign(PK[k], d[k]); }
  } catch (e) { console.error('loadPK', e); }
}
const APPCHECK_KEY = '';               // reCAPTCHA v3 site anahtarı (App Check). Boşsa kapalı
const DEMO_WID = '';                   // satış sayfasındaki "örnek galeri" için bir düğün id (galeri açık, yükleme kapalı)
const PRODUCTS = {                     // baskı ürünleri (fiyatları düzenleyin). kind:'qr' → fotoğraf seçmeden sipariş edilir
  album: {n:'Fotoğraf albümü 20x20, 20 sayfa', price:1200},
  canvas: {n:'Kanvas 40x60', price:750},
  prints: {n:'Baskı paketi 10x15 (50 adet)', price:450},
  qrcards: {n:'QR masa kartı (10 adet)', price:350, kind:'qr'},
  qrsign: {n:'Akrilik QR tabela A4', price:600, kind:'qr'}
};
/* ===================== */

firebase.initializeApp(CFG);
if (APPCHECK_KEY) firebase.appCheck().activate(APPCHECK_KEY, true);
const auth = firebase.auth(), db = firebase.firestore(), st = firebase.storage();
try { st.setMaxUploadRetryTime(25000); st.setMaxOperationRetryTime(25000); } catch (e) {} // varsayılan 10 dk: takılı kalmanın asıl sebebi
const TS = firebase.firestore.FieldValue.serverTimestamp;
const logEv = (t, wid) => db.collection('events').add({t, wid: wid || null, at: TS()}).catch(() => {});

          const p = ds[i].data(), im = new Image(); im.crossOrigin = 'anonymous'; im.src = await getUrl(p.thumbPath || p.path); if (!(await im.decode().then(() => true, () => false))) continue;
          const fs = await faceapi.detectAllFaces(faceFit(im), new faceapi.TinyFaceDetectorOptions({inputSize: 416, scoreThreshold: .45})).withFaceLandmarks().withFaceDescriptors();

  const queue = [], jobs = new Set(); let running = 0, runningVideo = false;
  const warn = e => { if ([...jobs].some(j => !j.final)) { e.preventDefault(); e.returnValue = t('leave'); } };
  addEventListener('beforeunload', warn); cleanup.push(() => removeEventListener('beforeunload', warn));
  const DENIED = ['storage/unauthorized', 'storage/unauthenticated', 'storage/quota-exceeded', 'permission-denied'];
  const sleepC = (j, ms) => new Promise(r => { const t0 = Date.now(), iv = setInterval(() => { if (j.cancelled || Date.now() - t0 >= ms) { clearInterval(iv); r(); } }, 250); });
  const waitOnline = j => new Promise(r => { const iv = setInterval(() => { if (navigator.onLine || j.cancelled) { clearInterval(iv); r(); } }, 1000); });
  const updSum = () => {
    const arr = [...jobs].filter(j => j.state !== 'cancelled'), done = arr.filter(j => j.state === 'done').length;
    $('#qhead').hidden = !arr.length;
    $('#qsum').textContent = `${done}/${arr.length} ${t('ofdone')}`;
    $('#qcan').hidden = !arr.some(j => !j.final);
  };
  const setBtn = (j, kind) => { // kind: 'x' iptal/kaldır, 'r' tekrar dene, '' yok
    const b = j.li.querySelector('.qx');
    b.hidden = !kind; b.textContent = kind === 'r' ? '↻' : '✕';
    b.title = b.ariaLabel = kind === 'r' ? t('retryb') : t('cancel');
    b.dataset.k = kind;
  };
  function finish(j, state, msg) {
    j.state = state; j.final = true;
    const em = j.li.querySelector('em');
    j.li.dataset.state = state;
    if (state === 'done') { em.textContent = '✓'; j.li.querySelector('progress').value = 1; setBtn(j, ''); if (j.thumbUrl) URL.revokeObjectURL(j.thumbUrl); }
    else if (state === 'cancelled') {
      em.textContent = t('cancelled'); setBtn(j, '');
      [j.thumbDone, j.fileDone].filter(Boolean).forEach(p => st.ref(p).delete().catch(() => {})); // yarım kalan dosyaları temizle
      setTimeout(() => { j.li.remove(); jobs.delete(j); updSum(); }, 1500);
    }
    else if (state === 'fatal') {
      em.textContent = msg; setBtn(j, msg === t('denied') ? 'r' : 'x');
      // kayıt oluşmadıysa yüklenmiş parçalar sunucuda yetim kalmasın; ↻ ile baştan yüklenir
      [j.thumbDone, j.fileDone].filter(Boolean).forEach(p => st.ref(p).delete().catch(() => {}));
      j.thumbDone = j.fileDone = null;
    }
    else { em.textContent = t('fail'); setBtn(j, 'r'); }
    updSum();
  }
  async function run(j) {
    const em = j.li.querySelector('em'), pr = j.li.querySelector('progress');
    j.state = 'run'; j.li.dataset.state = 'run'; setBtn(j, 'x');
    for (let a = 0; a < 4; a++) {
      if (j.cancelled) return finish(j, 'cancelled');
      try {
        if (!navigator.onLine) { em.textContent = t('offline'); await waitOnline(j); if (j.cancelled) return finish(j, 'cancelled'); }
        await uploadFile(wid, w, j,
          p => { if (!j.cancelled) { pr.value = p; em.textContent = Math.round(p * 100) + '%'; } },
          stage => { em.textContent = t(stage); });
        return finish(j, 'done');
      } catch (e) {
        console.warn(e);
        if (e.cancelled || j.cancelled) return finish(j, 'cancelled');
        if (e.fatal) return finish(j, 'fatal', e.message === 'size' ? t('big') : t('badtype'));
        if (DENIED.includes(e.code)) return finish(j, 'fatal', t('denied'));
        em.textContent = e.stalled ? t('stalled') : `${t('retry')} ${a + 1}/3`;
        if (a < 3) await sleepC(j, 2000 * 2 ** a);
      }
    }
    finish(j, 'fail');
  }
  const pump = () => {
    while (queue.length) {
      const nx = queue[0], cap = runningVideo || nx.isVideo ? 1 : 3;
      if (running >= cap) break;
      queue.shift(); running++; if (nx.isVideo) runningVideo = true;
      run(nx).finally(() => { running--; if (nx.isVideo) runningVideo = false; pump(); });
    }
  };
  function cancelJob(j) {
    if (j.final) { if (j.state !== 'done') { j.li.remove(); jobs.delete(j); updSum(); } return; } // başarısız satırı kaldır
    j.cancelled = true;
    const qi = queue.indexOf(j);
    if (qi >= 0) { queue.splice(qi, 1); return finish(j, 'cancelled'); }
    if (j.task) j.task.cancel(); // çalışan yükleme: run() iptali yakalayıp bitirir
  }
  function retryJob(j) {
    j.final = false; j.cancelled = false; j.state = 'wait';
    j.li.dataset.state = 'wait'; j.li.querySelector('em').textContent = t('wait'); setBtn(j, 'x');
    queue.push(j); updSum(); pump();
  }
  $('#qcan').onclick = () => [...jobs].forEach(j => { if (!j.final) cancelJob(j); });
  async function add(files) {
    if (!$('#kv').checked) { toast(t('needc')); return; }

    for (const f of files) {

      const mt = f.type || MIME[f.name && f.name.includes('.') ? ext(f.name) : ''] || '';
      const isImg = mt.startsWith('image'), isVid = mt.startsWith('video');
      const j = {id, file: f, name, note, li, isVideo: isVid, state: 'wait', final: false}; li.dataset.state = 'wait';
      if (isImg) { try { j.thumbUrl = URL.createObjectURL(f); } catch (e) {} }
      li.innerHTML = `${j.thumbUrl ? `<img class="th" src="${j.thumbUrl}" alt="">` : `<span class="th" style="display:flex;align-items:center;justify-content:center;font-size:.8rem">${isVid ? '🎞' : '🎙'}</span>`}<span class="nm">${esc(f.name || 'ses')}</span><progress max="1" value="0"></progress><em>${t('wait')}</em><button type="button" class="qx"></button>`;
      li.querySelector('.qx').onclick = () => (li.querySelector('.qx').dataset.k === 'r' ? retryJob(j) : cancelJob(j));
      setBtn(j, 'x');
      $('#qlist').prepend(li); jobs.add(j);
      if (isVid && f.size > 50 * 1048576) toast('Büyük video: yüklemesi bağlantınıza göre birkaç dakika sürebilir');
      queue.push(j);
    }
    updSum(); pump();
  }
  $('#fi').onchange = e => { add([...e.target.files]); e.target.value = ''; };
  $('#fc').onchange = e => { add([...e.target.files]); e.target.value = ''; };

  let mr = null, chunks = [];
  $('#rec').onclick = async () => {
    if (mr) { mr.stop(); return; }
    if (!$('#kv').checked) return toast(t('needc'));
    try {
      const s = await navigator.mediaDevices.getUserMedia({audio: true});
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      mr = new MediaRecorder(s, {mimeType: mime}); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => { s.getTracks().forEach(x => x.stop()); const b = new Blob(chunks, {type: mime}); mr = null; $('#rec').textContent = t('rec'); add([new File([b], 'ses.' + mime.split('/')[1], {type: mime})]); };
      mr.start(); $('#rec').textContent = '■ ' + t('stop');
    } catch (e) { toast('Mikrofon izni gerekli'); }
  };
}

async function zipPhotos(list, title, prog) {   // 120'şer dosyalık ZIP parçaları
  const per = 120, parts = Math.ceil(list.length / per);
  let failed = 0;
  for (let n = 0; n < parts; n++) {
    const z = new JSZip(), ch = list.slice(n * per, (n + 1) * per);
    for (let i = 0; i < ch.length; i++) {
      prog(`ZIP ${n + 1}/${parts} hazırlanıyor: ${i + 1}/${ch.length}`);
      try {
        const r = await fetch(await getUrl(ch[i].path)); if (!r.ok) throw new Error('fetch');
        z.file(`${slug(ch[i].name)}_${ch[i].id.slice(0, 5)}.${ext(ch[i].path)}`, await r.blob());
      } catch (e) { console.error(e); failed++; }
    }
    const b = await z.generateAsync({type: 'blob', compression: 'STORE'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${slug(title)}-${n + 1}.zip`; a.click();
  }
  prog(failed ? `${failed} dosya indirilemedi, ZIP'e eklenmedi` : '');
}
const ham = (a, b) => { let n = 0; for (const [x, y] of [[parseInt(a.slice(0, 8), 16), parseInt(b.slice(0, 8), 16)], [parseInt(a.slice(8), 16), parseInt(b.slice(8), 16)]]) { let v = (x ^ y) >>> 0; while (v) { v &= v - 1; n++; } } return n; };
// Yüz taraması için görseli küçült (800 px): aynı doğruluk, birkaç kat hızlı
const faceFit = (im, max = 800) => { const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, k = Math.min(1, max / Math.max(w, h)); if (k === 1 || !w) return im; const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c; };
async function switchFaceBackend(b) { try { if (await faceapi.tf.setBackend(b)) { await faceapi.tf.ready(); window.__faceBackend = b; return true; } } catch (e) { console.warn('motor değişmedi', b, e); } return false; }
// Selfie'den yüz çıkar: EXIF yönü uygulanmış görsel, farklı algılayıcı boyutları ve yan dönmüş fotoğraf için 90°/270° denemesi
async function selfieDescriptor(f) {
  let src = null;
  try { const bm = await createImageBitmap(f, {imageOrientation: 'from-image'}); const k = Math.min(1, 800 / Math.max(bm.width, bm.height));
    src = document.createElement('canvas'); src.width = Math.round(bm.width * k); src.height = Math.round(bm.height * k); src.getContext('2d').drawImage(bm, 0, 0, src.width, src.height); bm.close && bm.close();
  } catch (e) { const si = new Image(); si.src = URL.createObjectURL(f); await si.decode(); src = faceFit(si); }
  const rot = (cv, deg) => { const c = document.createElement('canvas'), r = deg % 180 !== 0; c.width = r ? cv.height : cv.width; c.height = r ? cv.width : cv.height;
    const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(deg * Math.PI / 180); x.drawImage(cv, -cv.width / 2, -cv.height / 2); return c; };
  // Her hassasiyet seviyesinde önce doğru yönü ara: yan yatmış yüzü gevşek ayarda "bulmak" bozuk sonuç verir
  const imgs = [src, rot(src, 90), rot(src, 270)];
  for (const [size, th] of [[416, .4], [320, .3], [608, .3], [224, .3]]) {
    for (const img of imgs) {
      const r = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({inputSize: size, scoreThreshold: th})).withFaceLandmarks().withFaceDescriptor();
      if (r) return r; } }
  return null;
}
async function loadFaceApi() {
  if (!window.faceapi) await new Promise((r, j) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js'; sc.onload = r; sc.onerror = j; document.head.appendChild(sc); });
  // Hesaplama motoru hazır olmadan modeller kullanılamaz (eski hata: 'wasm backend has not yet been initialized').
  // Sıra: WebGL (telefonlarda hızlı) → WebAssembly (GPU yoksa) → işlemci (son çare, yavaş).
  if (!window.__faceBackend) {
    const tf = faceapi.tf;
    try { tf.setWasmPaths('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@' + tf.version['tfjs-core'] + '/dist/'); } catch (e) {}
    for (const b of ['webgl', 'wasm', 'cpu']) { try { if (await tf.setBackend(b)) { await tf.ready();
      if (b === 'webgl') { const v = await tf.tidy(() => tf.tensor([1.5, 2.25, 3, 4]).square().sum()).data(); if (Math.abs(v[0] - 32.3125) > 1e-2) throw new Error('webgl hatalı sonuç: ' + v[0]); }
      window.__faceBackend = b; break; } } catch (e) { console.warn('yüz motoru', b, e); } }
  }
  const M = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
  if (!faceapi.nets.faceRecognitionNet.params) await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M), faceapi.nets.faceLandmark68Net.loadFromUri(M), faceapi.nets.faceRecognitionNet.loadFromUri(M)]);
}

        const qbPath = `weddings/${wid}/settings/qrbg.jpg`;

    };

    };

      const f = e.target.files[0]; if (!f) return;

      m.querySelector('#bgst').textContent = 'Yükleniyor…';

      } catch (e2) { m.querySelector('#bgst').textContent = 'Yüklenemedi, tekrar deneyin'; }
    };
    const bgx = m.querySelector('#bgx');
    if (bgx) bgx.onclick = async () => {
      await db.doc('weddings/' + wid).update({'theme.bg': firebase.firestore.FieldValue.delete()});
      w.theme = {...th, bg: undefined}; delete w.theme.bg; m.remove(); toast('Arka plan kaldırıldı'); $('#bSet').click();
    };
    m.querySelector('#sv').onclick = async () => {
      const g = s => m.querySelector(s), has = g('#i1').value || g('#i2').value || g('#i3').value || g('#i4').value || g('#i6').value || g('#i7').value;
      const frame = document.querySelector('input[name=tpl]:checked').value;

        title: g('#s1').value.trim() || w.title, welcome: g('#s2').value.trim(), 'theme.color': g('#s3').value, 'theme.frame': frame,
        uploadOpen: g('#o1').checked, moderation: g('#o2').checked, guestGallery: g('#o3').checked, originals: g('#o4').checked,
        invite: has ? {date: g('#i1').value, place: g('#i2').value, map: g('#i3').value, text: g('#i4').value, story: g('#i6').value, schedule: g('#i7').value, template: g('#i5').value} : null
      });
      theme({...w, theme: {...th, color: g('#s3').value}}); m.remove(); toast('Kaydedildi');
    };
  };
}

/* ===== Canlı duvar ===== */
async function wall(wid, key) {
  const u = await anon();
  const w = await getWedding(wid); if (!w) return notFound(); theme(w);
  if (!(PK[w.pkg] || PK.basic).wall) { app.innerHTML = `<div class="wrap"><p>Canlı duvar Plus ve Premium pakette.</p></div>`; return; }
  try {
    if (key) await db.doc(`weddings/${wid}/access/${u.uid}`).set({key});
    await db.collection(`weddings/${wid}/photos`).limit(1).get();
  } catch (e) { return keyForm(wid, !!key, 'wall'); }
  app.innerHTML = `<div class="wall"><div class="wtitle"><b>${esc(w.title)}</b>${w.eventDate ? `<small>${fmtDate(w.eventDate)}</small>` : ''}</div><div id="stage"></div>
    <div class="wqr"><img src="${qrUrl(guestLink(w, wid), 5)}" alt=""><span>Fotoğraf yükleyin</span></div><button class="btn sm fsb" id="fs">Tam ekran</button></div>`;
  $('#fs').onclick = () => { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); $('#fs').remove(); };
  let items = [], fresh = [], idx = 0, first = true, alive = true;
  cleanup.push(() => alive = false);
  cleanup.push(db.collection(`weddings/${wid}/photos`).where('status', '==', 'approved').onSnapshot(s => {
    s.docChanges().forEach(c => {
      if (c.type === 'removed') { items = items.filter(p => p.id !== c.doc.id); fresh = fresh.filter(p => p.id !== c.doc.id); return; }
      if (c.type === 'added') { const p = {id: c.doc.id, ...c.doc.data()}; if (p.type === 'audio') return; items.push(p); if (!first) fresh.push(p); }
    });
    first = false;
  }, () => {}));
  (async function loop() {
    while (alive) {
      let p = fresh.shift() || (items.length ? items[idx++ % items.length] : null);
      if (!p) { await sleep(1500); continue; }
      try {
        const url = await getUrl(p.path);
        $('#stage').innerHTML = `<div class="slide">${p.type === 'video' ? `<video src="${url}" autoplay muted playsinline></video>` : `<img src="${url}" alt="">`}
          <div class="cap">${esc(p.name || '')}${p.note ? `<small>${esc(p.note)}</small>` : ''}</div></div>`;
      } catch (e) { await sleep(1000); continue; }
      await sleep(p.type === 'video' ? 12000 : 6500);
    }
  })();
}
